<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Tracker</title>
</head>
<body>
 
    <header>
        <div class="logo">
            <h1>Fit Tracker</h1>
        </div>
         <nav>
            <ul>
                <li><a href="#resumen">Inicio</a></li>
                <li><a href="#rutinas">Rutinas</a></li>
                <li><a href="#ejercicios">Ejercicios</a></li>
                <li><a href="#calendario">Calendario</a></li>
                <li><a href="#progreso">Progreso</a></li>
            </ul>
        </nav>
    </header>

    <main>
 
        <section id="resumen">
            <h2>Resumen</h2>
        </section>
 
        <section id="rutinas">
            <h2>Rutinas</h2>
        </section>
 
        <section id="Ejercicios">
        <h2>Ejercicios</h2>

        <ul class="Lista-Ejercicios">
            <li class="Ejercicio-Item">
                <span class="Nombre-Ejercicio"></span>
                <span class="Grupo-Muscular"></span>
                <span class="Equipamiento"></span>
                <p class="Descripcion-Ejercicio"></p>
            </li>
        </ul>
    </section>
 
        <section id="Calendario">
        <h2>Calendario</h2>

        <div class="Controles-Calendario">
            <span class="Mes-Actual"></span>
        </div>

        <table class="Tabla-Calendario">
            <thead>
                <tr>
                    <th>Lun</th>
                    <th>Mar</th>
                    <th>Mié</th>
                    <th>Jue</th>
                    <th>Vie</th>
                    <th>Sab</th>
                    <th>Dom</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td class="Día-Calendario"></td>
                    <td class="Día-Calendario"></td>
                    <td class="Día-Calendario"></td>
                    <td class="Día-Calendario"></td>
                    <td class="Día-Calendario"></td>
                    <td class="Día-Calendario"></td>
                    <td class="Día-Calendario"></td>
                </tr>
            </tbody>
        </table>
        
    </section>
 
        <section id="progreso">
            <h2>Progreso</h2>
        </section>
 
    </main>
 
    <footer>
        <p>&copy; 2026 Fit Tracker. Todos los derechos reservados.</p>
    </footer>

 
</body>
</html>
